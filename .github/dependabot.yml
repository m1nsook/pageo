# Dependency update proposals. No automatic merges.
version: 2
updates:
  # Root Bun workspace, including apps/desktop and packages/core.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 2
    labels:
      - "maintenance"
    commit-message:
      prefix: "chore(deps)"

  # Tauri backend dependencies.
  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 2
    labels:
      - "maintenance"
      - "area:desktop"
    commit-message:
      prefix: "chore(deps)"

  # Keep our GitHub Actions maintained as well.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 2
    labels:
      - "maintenance"
    commit-message:
      prefix: "chore(ci)"
