name: TEMP — inspect Monaco exports and resolution

on:
  push:
    branches: [feat/monaco-source-editor]
    paths: [.github/workflows/inspect-monaco.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: Print Monaco package exports and resolution
        shell: bash
        run: |
          set -eu
          ROOT=$(realpath apps/desktop/node_modules/monaco-editor)
          echo "MONACO_ROOT=$ROOT"
          node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify({exports:p.exports,module:p.module,main:p.main,version:p.version,type:p.type},null,2))' "$ROOT/package.json"
          ls -l "$ROOT/esm/vs/editor/editor.worker.js" "$ROOT/esm/vs/language/css/css.worker.js"
          cd apps/desktop
          node --input-type=module -e 'for(const p of ["monaco-editor","monaco-editor/esm/vs/editor/editor.worker.js","monaco-editor/esm/vs/language/css/css.worker.js"]){try{console.log("RESOLVED",p,import.meta.resolve(p))}catch(e){console.log("RESOLUTION ERROR",p,e.message)}}'
