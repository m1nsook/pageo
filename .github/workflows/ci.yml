name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript & Vite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile
      - name: Desktop HTML shell regression tests
        run: node --test apps/desktop/test/*.test.mjs
      - name: CLI project and manifest regression tests
        run: node --test packages/cli/test/*.test.mjs
      - name: Bundle site runtime (minified browser scripts)
        run: bun packages/site-runtime/build.mjs
      - name: Website runtime regression tests
        run: node --test packages/site-runtime/test/*.test.mjs
      - name: Type check
        run: bun run check
      - name: Production web build
        run: bun run build

  headless:
    name: Headless Markdown preparation (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated headless dependencies
        run: npm install --prefix tools/headless --no-audit --no-fund --package-lock=false
      - name: Headless sanitizer and public-pages tests
        run: node --test tools/headless/test/*.test.mjs

  rust:
    name: Tauri Rust check (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and compiled artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Set up Bun for embedded site runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install workspace dependencies for embedded MiniSearch
        run: bun install --frozen-lockfile
      - name: Check Rust backend using Cargo.lock
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Test Rust backend
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
