name: Studio nightly installer (test artifacts only)
on:
  schedule:
    - cron: "25 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-nightly
  cancel-in-progress: true
jobs:
  build:
    name: Build Windows nightly without a GitHub Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
      - name: Build embedded website runtime
        run: bun packages/site-runtime/build.mjs
      - name: Regression checks
        run: |
          node --test apps/desktop/test/*.test.mjs
          bun run check
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - name: Build Windows test installer
        working-directory: apps/desktop
        run: bun run bundle:windows
      - name: Upload nightly artifact (never a release)
        uses: actions/upload-artifact@v4
        with:
          name: Paglora-nightly-${{ github.run_number }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
