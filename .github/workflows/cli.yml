name: CLI npm package

on:
  pull_request:
    paths:
      - "packages/cli/**"
      - ".github/workflows/cli.yml"
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - ".github/workflows/cli.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: Pageo CLI (Node ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test CLI
        run: node --test packages/cli/test/cli.test.mjs
      - name: Check package contents
        run: npm pack --dry-run ./packages/cli
