name: One-time updater Cargo.lock resolution
on:
  push:
    branches:
      - feat/signed-studio-updater-v020
    paths:
      - .github/workflows/regenerate-updater-lock.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/signed-studio-updater-v020
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve Rust dependencies while preserving existing lock choices
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Commit generated Cargo.lock to updater feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore(updater): resolve locked Tauri updater dependency'
            git push origin HEAD:feat/signed-studio-updater-v020
          fi
