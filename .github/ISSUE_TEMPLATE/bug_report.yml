name: Bug report
description: Report something that isn't working in Paglora.
title: "[Bug]: "
labels: ["bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a problem. Please remove private information from logs."
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Desktop app
        - Visual editor
        - Project files / backups
        - Static export
        - npm package / CLI
        - Other / unsure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Not applicable
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Paglora version
      placeholder: "e.g. 0.1.0 or a commit hash; use not released if applicable"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Optional. Redact any secrets, tokens, and personal paths.
