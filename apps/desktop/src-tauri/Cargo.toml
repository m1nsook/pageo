[package]
name = "paglora"
default-run = "paglora"
version = "0.2.0"
description = "Paglora, a local-first documentation studio"
authors = ["m1nsook"]
license = "MIT"
edition = "2021"

[lib]
name = "paglora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21.7"
