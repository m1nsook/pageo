[package]
name = "paglora"
default-run = "paglora"
version = "0.2.0"
description = "Paglora, a local-first documentation studio"
authors = ["m1nsook"]
license = "MIT"
edition = "2021"

[lib]
name = "paglora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21.7"
tauri-plugin-updater = "2"

# Native Windows dialog only; no renderer filesystem permission changes.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
