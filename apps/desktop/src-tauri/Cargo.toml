[package]
name = "pageo"
version = "0.1.0"
description = "Pageo, a local-first documentation studio"
authors = ["m1nsook"]
license = "MIT"
edition = "2021"

[lib]
name = "pageo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
